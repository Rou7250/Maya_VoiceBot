      - key: DEMO_LOAN_TYPE
        value: Personal Loan
      - key: DEMO_OVERDUE_AMOUNT
        value: "8499"
      - key: DEMO_DAYS_PAST_DUE
        value: "12"
      - key: MOCK_VALID_CODES
        value: 1234,1995
      - key: VAPI_WEBHOOK_SECRET
        sync: false
